<meta name="description" content="#コンパスのカードのクールタイム（CT）とカード名を覚える非公式ドリル">

<meta name="theme-color" media="(prefers-color-scheme:dark)" content="#0f1328">

</head><body>
<style>
/* 画面の作り：上に見出し、中央に内容、下にタブ。練習中はタブを消して1画面に収める */
:root{
  --bg:#eef0f6; --surface:#ffffff; --ink:#161d36; --muted:#596280; --line:#d6dae7; --soft:#e4e8f2;
  --accent:#d92765; --accent-ink:#ffffff; --ok:#12794f; --ng:#c8321f;
  --quiz:#d92765; --learn:#2463cf; --rep:#1f8440; --grd:#a96a00;
  --fire:#e2483a; --water:#2f6fe0; --wood:#2b9a4b; --none:#6d7385;
  --key:#ffffff; --key-shadow:#c4c9d8;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-num:"Chakra Petch","SF Mono",ui-monospace,monospace;
  --tab-h:58px; --sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1328; --surface:#1a2040; --ink:#ebeef9; --muted:#a3acca; --line:#303968; --soft:#252c54;
  --accent:#ff6a9a; --accent-ink:#22060f; --ok:#46d496; --ng:#ff7a68;
  --quiz:#ff6a9a; --learn:#76a6ff; --rep:#5bd081; --grd:#f0b144;
  --fire:#ff6a5b; --water:#5b93ff; --wood:#4cc46d; --none:#8e95ab;
  --key:#262e59; --key-shadow:#0a0d1e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1328; --surface:#1a2040; --ink:#ebeef9; --muted:#a3acca; --line:#303968; --soft:#252c54;
  --accent:#ff6a9a; --accent-ink:#22060f; --ok:#46d496; --ng:#ff7a68;
  --quiz:#ff6a9a; --learn:#76a6ff; --rep:#5bd081; --grd:#f0b144;
  --fire:#ff6a5b; --water:#5b93ff; --wood:#4cc46d; --none:#8e95ab;
  --key:#262e59; --key-shadow:#0a0d1e; color-scheme:dark}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h2{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.3;margin:0}
h3{font-size:14px;margin:0;font-weight:700}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted);line-height:1.65;margin:0}
.note a{color:inherit}
.danger{color:var(--ng)!important}
#fall{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#fall img{position:absolute;top:-90px;opacity:.16;will-change:transform;animation:fall linear forwards}
body[data-scr="play"] #fall{opacity:.45}
@keyframes fall{from{transform:translate(0,0) rotate(var(--r0))}50%{transform:translate(var(--sx),55vh) rotate(var(--r1))}to{transform:translate(0,calc(100vh + 120px)) rotate(var(--r2))}}

.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(var(--tab-h) + var(--sab) + 24px) max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;min-height:44px}
.brand{font-family:var(--f-display);font-size:20px;line-height:1.15}
.brand small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted)}
.muteb{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:46px;height:42px;font-size:19px;line-height:1;padding:0;flex:none}
.muteb.on{background:var(--soft);border-style:dashed;border-color:var(--muted)}
.screen{display:flex;flex-direction:column;gap:14px}
.stack{display:flex;flex-direction:column;gap:12px}

/* 下のタブ */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--sab)}
#tabs>div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
#tabs button{border:0;background:none;height:var(--tab-h);font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
#tabs svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tabs button[aria-current="page"]{color:var(--accent)}
#tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:26%;right:26%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

/* ボタン */
.primary{background:var(--m,var(--accent));color:var(--accent-ink);border:0;border-radius:14px;padding:14px 16px;font-family:var(--f-body);font-weight:900;font-size:17px;min-height:52px}
.primary:active,.sub:active,.tile:active{transform:translateY(1px)}
.sub{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-weight:700;font-size:14.5px;min-height:46px;text-align:center}
.lnk{border:0;background:none;color:var(--accent);font-weight:700;font-size:13.5px;padding:10px 6px;text-decoration:underline;text-underline-offset:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--ink)}

/* ホーム */
.newupd{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;text-align:left;padding:10px 14px;border-radius:12px;border:1px solid var(--learn);background:color-mix(in srgb,var(--learn) 10%,var(--surface));font-size:13.5px;font-weight:700}
.newupd .go{color:var(--learn)}
.nb{display:inline-block;font-family:var(--f-num);font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--learn);color:var(--surface)}
.a2hs{display:grid;grid-template-columns:1fr auto;align-items:start;padding:4px 4px 4px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.a2hs summary{cursor:pointer;font-weight:700;padding:8px 0}.a2hs p{margin:0 0 8px;color:var(--muted)}
.a2x{border:0;background:none;color:var(--muted);font-size:20px;width:42px;height:40px;padding:0}
.resume{display:grid;grid-template-columns:1fr auto;background:var(--surface);border:2px solid var(--m);border-radius:14px;overflow:hidden}
.resume .rgo{border:0;background:none;text-align:left;padding:9px 14px;font-weight:900;font-size:15px;line-height:1.4;color:var(--m)}
.resume .rgo small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.resume .rdel{border:0;border-left:1px solid var(--line);background:none;color:var(--muted);font-size:13px;padding:0 14px}
.today{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:9px}
.today .tr{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.today b{font-family:var(--f-num);font-size:21px;color:var(--ink);margin-right:2px}
.meter{display:flex;height:9px;border-radius:9px;background:var(--soft);overflow:hidden;gap:2px}
.meter i{display:block;height:100%}
.l3{background:var(--ok)}.l2{background:color-mix(in srgb,var(--ok) 55%,var(--soft))}.l1{background:var(--grd)}.l0{background:var(--soft)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;border:1px solid color-mix(in srgb,var(--m) 45%,var(--line));border-radius:18px;background:color-mix(in srgb,var(--m) 9%,var(--surface));padding:13px 13px 12px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:124px}
.tile .ti{font-size:27px;line-height:1;margin-bottom:5px}
.tile b{font-size:17px;font-weight:900;line-height:1.3;color:var(--m)}
.tile small{text-wrap:balance;font-size:12.5px;color:var(--muted);line-height:1.45}
.m-quiz{--m:var(--quiz)}.m-learn{--m:var(--learn)}.m-rep{--m:var(--rep)}.m-grd{--m:var(--grd)}
.weakb{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;font-weight:700;font-size:15px}
.weakb span{flex:1}.weakb small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.cnt{font-family:var(--f-num);font-size:19px;font-weight:700;color:var(--accent)}
.foot{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);padding-top:2px}
.code{font-family:var(--f-num);font-size:15px;font-weight:700;padding:6px 10px;border-radius:9px;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);color:inherit}
.code small{font-family:var(--f-body);font-size:11px;margin-left:4px;font-weight:500;color:var(--muted)}

/* 下から出る設定シート */
#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(6,8,20,.55)}
.shc{width:100%;max-width:520px;max-height:92vh;max-height:92dvh;background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.shh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 8px 8px 16px}
.shx{border:0;background:none;font-size:22px;width:44px;height:44px;color:var(--muted);padding:0}
.shb{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:2px 16px 14px;display:flex;flex-direction:column;gap:15px}
.shf{padding:10px 16px calc(12px + var(--sab));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.shf .info{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}.shf .info b{color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px}
.label{font-size:13px;color:var(--muted);font-weight:700}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:700;font-size:14px;line-height:1.25;min-height:42px}
.seg button small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--m,var(--accent));box-shadow:0 1px 4px rgba(10,15,40,.18)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 11px;min-height:40px;font-size:14px;font-weight:700}
.chips button[aria-pressed="true"]{background:var(--m,var(--accent));border-color:transparent;color:var(--accent-ink)}
.chips button small{font-weight:500;font-size:11.5px;opacity:.75;margin-left:3px}
select,.inp{width:100%;font-size:16px;padding:10px 12px;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.more summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.more summary::-webkit-details-marker{display:none}.more summary::after{content:"▼";font-size:11px;color:var(--muted);align-self:center}.more[open] summary::after{content:"▲"}
.more summary span{margin-left:auto;font-weight:500;font-size:12.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more>div{display:flex;flex-direction:column;gap:14px;padding-top:12px}

/* 練習中（1画面に収める） */
body[data-scr="play"]{overflow:hidden}
body[data-scr="play"] .top,body[data-scr="play"] #tabs{display:none}
body[data-scr="play"] .app{height:100vh;height:100dvh;padding-top:6px;padding-bottom:calc(8px + var(--sab))}
body[data-scr="play"] .screen{height:100%;min-height:0;gap:8px}
.ptop{display:flex;align-items:center;gap:8px;flex:none}
.pq{border:1px solid var(--line);background:var(--surface);border-radius:12px;height:42px;padding:0 12px;font-weight:700;font-size:14px;white-space:nowrap}
.pt{flex:1;min-width:0;display:flex;align-items:baseline;gap:7px;justify-content:center}
.ptt{font-size:12.5px;font-weight:700;color:var(--m);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt .num{font-size:20px;font-weight:700;white-space:nowrap}.pt .num small{font-size:13px;color:var(--muted)}
.pclock{font-size:14px;color:var(--muted);min-width:3.6em;text-align:right;white-space:nowrap}
.bar{height:5px;background:var(--soft);border-radius:5px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--m,var(--accent));transition:width .25s}
.pc{flex:1;min-height:0;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;gap:12px;padding:10px 12px 10px 18px}
.pc::before{content:"";position:absolute;inset:0 auto 0 0;width:8px;background:var(--el)}
[data-el="火"]{--el:var(--fire)}[data-el="水"]{--el:var(--water)}[data-el="木"]{--el:var(--wood)}[data-el="無"]{--el:var(--none)}
.cname,.fname b,.row .n,.gc .gn{font-feature-settings:"palt"}
#shT:focus{outline:none}#ebar:empty,#delList:empty,#fp:empty{display:none}
.pimg{position:relative;flex:0 0 53%;min-height:0}
.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ptx{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;overflow-y:auto}
.ptx>:first-child{margin-top:auto}.ptx>:last-child{margin-bottom:auto}
.meta{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;border-radius:7px;padding:1px 8px;border:1px solid var(--line);color:var(--muted)}
.chip.el{background:var(--el);color:#fff;border-color:transparent}.chip.type{color:var(--ink);border-color:var(--ink)}
.cname{font-weight:900;font-size:clamp(16px,4.8vw,22px);line-height:1.35;overflow-wrap:anywhere}
.cname .full{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.ability{font-size:13px;color:var(--muted);line-height:1.5}
.ability button{border:1px dashed var(--muted);background:none;border-radius:9px;padding:5px 10px;font-size:13px;color:var(--muted);min-height:36px}
.tq{color:var(--ink)}.tq .when{display:block;font-weight:700;font-family:var(--f-num);font-size:clamp(30px,9.5vw,40px);line-height:1.1}.tq .q{display:block;font-weight:700;margin-top:3px}.tq .sm{display:block;font-size:12.5px;color:var(--muted)}
.pbot{flex:none;display:flex;flex-direction:column;gap:8px}
.ask{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:46px}
.askb{display:flex;gap:7px;min-width:0}
.tg,.skip,.mic{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:44px;padding:0 13px;font-size:14px;font-weight:700;white-space:nowrap}
.tg.on{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.skip{color:var(--muted)}
.mic{border:2px solid var(--rep);color:var(--rep);min-width:0;white-space:normal;line-height:1.2}.mic.on{background:var(--rep);color:var(--accent-ink);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.65}}
.readout{flex:none;font-family:var(--f-num);font-size:38px;font-weight:700;line-height:1;min-width:2.7ch;text-align:right;border-bottom:3px solid var(--m,var(--ink));padding:0 2px 2px;white-space:nowrap}
.readout span{font-family:var(--f-body);font-size:15px;color:var(--muted);margin-left:3px;font-weight:700}
.readout.empty{color:var(--line)}
.pad{--kh:clamp(34px,7.4vh,62px);--kh:clamp(34px,7.4dvh,62px);display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.pad button{grid-column:span 4;height:var(--kh);border:0;background:var(--key);border-radius:12px;box-shadow:0 2px 0 var(--key-shadow);font-family:var(--f-num);font-weight:700;font-size:24px;padding:0}
.pad.prec button:nth-last-child(-n+4){grid-column:span 3}
.pad button:active{transform:translateY(2px);box-shadow:none}
.pad .go{background:var(--m,var(--accent));color:var(--accent-ink);font-family:var(--f-body);font-weight:900;font-size:18px}
.pad .del{font-size:20px}
.ch4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ch4 button{height:clamp(62px,12.6vh,96px);border:1px solid var(--line);background:var(--key);border-radius:14px;font-family:var(--f-num);font-weight:700;font-size:30px}
.ch4 button small{font-family:var(--f-body);font-size:14px;color:var(--muted);margin-left:2px}
.ch4 .hit{background:var(--ok);color:var(--surface)}.ch4 .miss{background:var(--ng);color:var(--surface)}.ch4 .hit small,.ch4 .miss small{color:inherit}
.fb{flex:1;border-radius:16px;padding:10px 16px;display:flex;align-items:center;gap:16px;min-height:0}
.fb.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface))}.fb.ng{background:color-mix(in srgb,var(--ng) 13%,var(--surface))}
.fb .big{font-family:var(--f-display);font-size:46px;line-height:1}.fb.ok .big{color:var(--ok)}.fb.ng .big{color:var(--ng)}
.fb .ans{flex:1;min-width:0;font-size:14px;line-height:1.5}
.fb .av{font-family:var(--f-num);font-size:36px;font-weight:700;line-height:1.1}.fb .av small{font-family:var(--f-body);font-size:15px;margin-left:2px}
.fb .calc{display:block;font-size:13px;color:var(--muted)}
.fb .ans b{font-family:var(--f-num)}
.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center;cursor:pointer}
.fwrap .pimg{flex:1}
.fname{flex:none;min-height:112px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px}
.fname b{font-weight:900;font-size:clamp(19px,5.8vw,26px);line-height:1.3;overflow-wrap:anywhere}
.fname small{font-size:12.5px;color:var(--muted)}.fname .tapme{font-size:14px;color:var(--muted)}
.fbtns{display:grid;grid-template-columns:.8fr 1fr 1.4fr;gap:8px;flex:none}
.nickrow{display:flex;gap:8px;width:100%}.nickrow .inp{flex:1;min-width:0}.nickrow .primary{padding:8px 16px;min-height:46px;font-size:15px}
/* 縦に余裕がある画面：カード絵を大きく上に */

  if(!raw||raw.repRange==null)o.repRange=o.flashRange=o.range;if(!raw||raw.repCount==null)o.repCount=o.grdCount=o.count;
  ["flashRange","repRange"].forEach(k=>o[k]=rg(o[k]));["repCount","grdCount"].forEach(k=>o[k]=ct(o[k]));

// same＝前の回のキャラ・答え方（結果画面からのやり直し用）。なければ今の設定を使う

  SND.startBgm();
  const precise=!!(hero&&!choice&&(same?same.precise:settings.precise));
  const cond=[hero?hero.name+"短縮"+(precise?"・小数":""):"",choice?"4択":"",isWeak?"復習":rangeName(settings.range)+(settings.qtype?"・"+settings.qtype:"")].filter(Boolean).join("・");

// ---- キーボード（パソコン用） ----
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||e.isComposing)return;
  if(e.key==="Escape"&&$("#sheet")){closeSheet();return}
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||$("#sheet")||$("#cheerM")||$("#shareM")||scr!=="play")return;
  const enter=e.key==="Enter",nx=$("#next");
  if(nx){if(enter||e.key===" "){e.preventDefault();if(!e.repeat)nx.click()}return}
  if(enter&&e.target.tagName==="BUTTON"&&!e.target.closest("#pad"))return;
  if(flash){if(e.key===" "||enter){e.preventDefault();$("#fYes")?.click()}else if(e.key==="ArrowLeft")$("#fBack")?.click();return}
  if($("#ch4")){if(/^[1-4]$/.test(e.key))pickChoice(+e.key-1);return}
  if(!$("#pad"))return;
  const t=!!tgame;
  if(/^\d$/.test(e.key)||(e.key==="."&&!t)){if(t)tDigit(e.key);else typeDigit(e.key)}
  else if(e.key==="Backspace"){e.preventDefault();if(t)tDel();else del()}
  else if(enter){e.preventDefault();if(t)tSubmit();else submitCt()}
});

// ---- 画像（IndexedDB・この端末のみ） ----
const DB={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open("cdrill",1);r.onupgradeneeded=()=>r.result.createObjectStore("img");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async tx(fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction("img","readwrite");fn(t.objectStore("img"));t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})},
  put(k,v){return this.tx(st=>st.put(v,k))},
  del(k){return this.tx(st=>st.delete(k))},
  async all(){const db=await this.open();return new Promise((res,rej)=>{const m={};const r=db.transaction("img").objectStore("img").openCursor();r.onsuccess=()=>{const c=r.result;if(c){m[c.key]=c.value;c.continue()}else res(m)};r.onerror=()=>rej(r.error)})}
};

$("#bgmFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;
  SND.stopBgm();settings.bgmSrc="own";settings.bgm=1;save();

  let blob=f,note="";
  try{blob=await extractAudio(f);note=`音声だけを取り出しました（${(blob.size/1048576).toFixed(1)}MB）。`}catch(err){note="音声だけの取り出しはできなかったので、ファイルをそのまま使います。"}
  SND.setOwn(blob);SND.startBgm();

  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(err){}
  SND.ownStat=ok?note+"この端末に保存したので、次からは選び直さなくて大丈夫です。":note+"⚠ この端末に保存できませんでした（容量オーバーなど）。今回だけ再生できます。短い動画で試してください。";
  refreshPrefs()};
async function extractAudio(file){
  const A=window.AudioContext||window.webkitAudioContext,ac=SND.ensure()||new A();
  const buf=await file.arrayBuffer();
  const dec=await new Promise((res,rej)=>{const p=ac.decodeAudioData(buf,res,rej);if(p&&p.then)p.then(res,rej)});
  const sr=22050,dur=Math.min(dec.duration,600),len=Math.ceil(dur*sr);
  const O=window.OfflineAudioContext||window.webkitOfflineAudioContext,oc=new O(1,len,sr);
  const src=oc.createBufferSource();src.buffer=dec;src.connect(oc.destination);src.start();
  const out=await new Promise((res,rej)=>{oc.oncomplete=e=>res(e.renderedBuffer);const p=oc.startRendering();if(p&&p.then)p.then(res,rej)});
  const d=out.getChannelData(0),b=new ArrayBuffer(44+d.length*2),v=new DataView(b);
  const w=(o,str)=>{for(let k=0;k<str.length;k++)v.setUint8(o+k,str.charCodeAt(k))};
  w(0,"RIFF");v.setUint32(4,36+d.length*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,d.length*2,true);
  for(let k=0;k<d.length;k++){const x=Math.max(-1,Math.min(1,d[k]));v.setInt16(44+k*2,x<0?x*32768:x*32767,true)}
  const nm=(file.name||"音源").replace(/\.[^.]+$/,"");
  return new File([b],nm+".wav",{type:"audio/wav"});
}
$("#file").onchange=async e=>{
  const file=e.target.files[0]; if(!file||!editing||!$("#ed"))return; const mine=editing;
  const img=new Image(); img.src=URL.createObjectURL(file);
  try{await img.decode()}catch(err){if($("#ed"))$("#ed").innerHTML=`<p class="note danger">画像を読み込めませんでした。PNGかJPEGのスクショを選んでください。</p>`;return}
  if(editing!==mine||!$("#ed"))return; // 読み込み中に閉じた・別のカードに移ったとき
  editing.img=img; editing.rect=detectArt(img); editing.adj={t:0,b:0,l:0,r:0};
  showEditor();
};
// カード詳細画面のスクショから、外側の属性色（赤・青・緑）の枠を手がかりにカード絵の範囲を推定する
function detectArt(img){
  const W=img.naturalWidth,H=img.naturalHeight,sc=Math.min(1,400/W);
  const cv=document.createElement("canvas");cv.width=Math.round(W*sc);cv.height=Math.round(H*sc);
  const cx=cv.getContext("2d",{willReadFrequently:true});cx.drawImage(img,0,0,cv.width,cv.height);
  const d=cx.getImageData(0,0,cv.width,cv.height).data;
  let x0=1e9,y0=1e9,x1=-1,y1=-1;
  for(let y=0;y<cv.height;y++)for(let x=0;x<cv.width;x++){const i=(y*cv.width+x)*4;
    const r=d[i],g=d[i+1],b=d[i+2];
    if((r>190&&g<60&&b<60)||(g>150&&r<90&&b<70)||(b>170&&r<60&&g<90)){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(x1>0&&(x1-x0)>cv.width*.5&&(y1-y0)>cv.height*.45){
    const bx=x0/sc,by=y0/sc,bw=(x1-x0)/sc,bh=(y1-y0)/sc;
    return{x:bx+bw*.0208,y:by+bh*.0807,w:bw*.9584,h:bh*.8809};
  }
  return{x:W*.149,y:H*.179,w:W*.702,h:H*.671};
}
function cropRect(){const r=editing.rect,a=editing.adj,W=editing.img.naturalWidth,H=editing.img.naturalHeight,u=W*.004;
  const x=Math.max(0,r.x-a.l*u),y=Math.max(0,r.y-a.t*u);
  return{x,y,w:Math.max(10,Math.min(W-x,r.w+(a.l+a.r)*u)),h:Math.max(10,Math.min(H-y,r.h+(a.t+a.b)*u))}}
function drawCrop(cv,maxW){const c=cropRect(),k=Math.min(1,maxW/c.w);cv.width=Math.round(c.w*k);cv.height=Math.round(c.h*k);
  cv.getContext("2d").drawImage(editing.img,c.x,c.y,c.w,c.h,0,0,cv.width,cv.height)}
function closeEditor(){if($("#ed"))$("#ed").innerHTML="";editing=null}
function showEditor(){
  const c=editing.card;
  $("#ed").innerHTML=`<div class="editor"><h2>${esc(c.name)}</h2><canvas id="cv"></canvas>
    ${[["t","上"],["b","下"],["l","左"],["r","右"]].map(([k,t])=>`<label class="sl">${t}<input type="range" id="adj-${k}" min="-30" max="30" value="0"><span></span></label>`).join("")}
    <p class="note">ずれていたらスライダーで調整します。右に動かすとその方向に広がります。</p>
    <div class="btns"><button class="primary" id="saveImg" type="button">保存</button><button class="sub" id="cancelImg" type="button">やめる</button></div>
    ${IMG[c.name]?`<button class="sub danger" id="delImg" type="button">登録済みの画像を削除</button>`:""}</div>`;
  const cv=$("#cv");drawCrop(cv,800);
  $("#ed").querySelectorAll("input[type=range]").forEach(r=>r.oninput=()=>{editing.adj[r.id.slice(4)]=+r.value;drawCrop(cv,800)});
  $("#cancelImg").onclick=closeEditor;
  $("#saveImg").onclick=()=>{const out=document.createElement("canvas");drawCrop(out,480);
    out.toBlob(async b=>{try{await DB.put(c.name,b)}catch(err){$("#ed").insertAdjacentHTML("beforeend",`<p class="note danger">保存できませんでした。プライベートブラウズでは保存できないことがあります。</p>`);return}
      if(IMG[c.name])URL.revokeObjectURL(IMG[c.name]);IMG[c.name]=URL.createObjectURL(b);closeEditor();afterImg()},"image/jpeg",.85)};
  const del=$("#delImg");if(del)del.onclick=async()=>{try{await DB.del(c.name)}catch(err){}if(PRESET[c.name])IMG[c.name]=PRESET[c.name];else delete IMG[c.name];closeEditor();afterImg()};
  $("#ed").scrollIntoView({behavior:"smooth",block:"nearest"});
}

// ---- 端末間の同期（claude.aiアカウントに保存） ----
let syncRef=null,syncTimer=null,syncState="local";
function syncBody(){return{nick:Object.entries(NICK),excl:[...EXCL],del:[...DEL],mada:[...MADA],t:Date.now()}}
function queueSync(){if(!syncRef)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>{syncTimer=null;syncRef.set(syncBody()).catch(()=>{})},600)}
function applyRemote(d){
  NICK=Object.fromEntries(Array.isArray(d.nick)?d.nick:[]);EXCL=new Set(d.excl||[]);DEL=new Set(d.del||[]);if(d.mada)MADA=new Set(d.mada);
  try{localStorage.setItem("cdrill:nick",JSON.stringify(NICK));localStorage.setItem("cdrill:excl",JSON.stringify([...EXCL]));localStorage.setItem("cdrill:del",JSON.stringify([...DEL]));localStorage.setItem("cdrill:mada",JSON.stringify([...MADA]))}catch(e){}
  if($("#sheet"))return; if(scr==="list"&&listDraw)listDraw(); else if(scr==="home")home();
}
(async()=>{try{
  if(!window.claude||!claude.use)return;
  const db=await claude.use("db"),user=await claude.use("user"); if(!db||!user)return;
  const id=await user.id(); if(!id)return;
  const ref=db.collection("data/users/"+id).doc("prefs");
  const snap=await ref.get(); const first=!store.get("synced",false);
  if(snap.exists){const d=snap.data();
    if(first){const n=Object.fromEntries(Array.isArray(d.nick)?d.nick:[]);
      applyRemote({nick:Object.entries({...NICK,...n}),excl:[...new Set([...(d.excl||[]),...EXCL])],del:[...new Set([...(d.del||[]),...DEL])],mada:[...new Set([...(d.mada||[]),...MADA])]});
      syncRef=ref;await ref.set(syncBody());}
    else{applyRemote(d);syncRef=ref;}
  }else{syncRef=ref;if(Object.keys(NICK).length||EXCL.size||DEL.size)await ref.set(syncBody());}
  try{localStorage.setItem("cdrill:synced","true")}catch(e){}
  syncState="sync";
  let skip=true;ref.onSnapshot(sn=>{if(skip){skip=false;return}if(sn.exists&&!syncTimer)applyRemote(sn.data())},()=>{});
}catch(e){}})();

home();
