<title>カード秒数ドリル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* layout: one-screen drill app. top bar, card panel, answer pad pinned low for thumbs */
:root{
  --bg:#eef0f5; --surface:#ffffff; --ink:#18203a; --muted:#5d6681; --line:#d5d9e5;
  --accent:#e0336f; --accent-ink:#ffffff; --ok:#16855a; --ng:#c8321f;
  --fire:#e2483a; --water:#2f6fe0; --wood:#2b9a4b; --none:#6d7385;
  --key:#ffffff; --key-shadow:#c4c9d8;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-num:"Chakra Petch","SF Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10142a; --surface:#1a2040; --ink:#e9ecf7; --muted:#9aa3c2; --line:#2c3460;
  --accent:#ff5a8f; --accent-ink:#1a0a12; --ok:#3fcf8e; --ng:#ff6b57;
  --fire:#ff6a5b; --water:#5b93ff; --wood:#4cc46d; --none:#8e95ab;
  --key:#232a52; --key-shadow:#0b0e20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10142a; --surface:#1a2040; --ink:#e9ecf7; --muted:#9aa3c2; --line:#2c3460;
  --accent:#ff5a8f; --accent-ink:#1a0a12; --ok:#3fcf8e; --ng:#ff6b57;
  --fire:#ff6a5b; --water:#5b93ff; --wood:#4cc46d; --none:#8e95ab;
  --key:#232a52; --key-shadow:#0b0e20; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;}
#fall{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#fall img{position:absolute;top:-90px;opacity:.22;will-change:transform;animation:fall linear forwards}
@keyframes fall{from{transform:translate(0,0) rotate(var(--r0))}50%{transform:translate(var(--sx),55vh) rotate(var(--r1))}to{transform:translate(0,calc(100vh + 120px)) rotate(var(--r2))}}
@media (prefers-reduced-motion:reduce){#fall{display:none}}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-block:14px 18px;gap:14px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--f-display);font-size:20px;letter-spacing:.02em;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);letter-spacing:.12em;font-weight:500}
.tops{display:flex;gap:8px;align-items:center}.mute{font-size:22px;line-height:1;padding:6px 12px!important;min-width:52px;border:2px solid var(--accent)!important;background:var(--surface)!important;box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 30%,transparent)}.mute.on{border-color:var(--muted)!important;border-style:dashed!important;background:color-mix(in srgb,var(--muted) 18%,var(--surface))!important;box-shadow:none}
.resume{display:grid;grid-template-columns:1fr auto;gap:8px}.resume .primary{font-size:16px;letter-spacing:.02em;text-align:left;padding:13px 16px}.resume .primary small{display:block;font-family:var(--f-body);font-size:12px;opacity:.85;letter-spacing:0}.resume .sub{font-size:13px;padding:8px 12px}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}
.screen{display:flex;flex-direction:column;gap:14px;flex:1}
h2{font-family:var(--f-display);font-weight:400;font-size:17px;margin:0;text-wrap:balance}
.label{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:10px 4px;font-weight:700;font-size:14px;line-height:1.25}
.seg button small{display:block;font-weight:500;font-size:10.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button[aria-pressed="true"] small{color:inherit;opacity:.75}
.field{display:flex;flex-direction:column;gap:7px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:16px;font-family:var(--f-display);font-size:19px;letter-spacing:.06em;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.sub{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;font-weight:700;font-size:15px}
.sub:disabled{opacity:.45;cursor:default}
.note{font-size:12px;color:var(--muted);line-height:1.7}
.note a{color:inherit}
.best{display:flex;gap:10px;flex-wrap:wrap}
.best div{flex:1;min-width:120px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.best b{font-family:var(--f-num);font-size:22px;display:block}

/* card */
.card{position:relative;background:var(--surface);border-radius:16px;padding:16px 16px 14px 22px;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;gap:10px}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:8px;background:var(--el)}
.card[data-el="火"]{--el:var(--fire)} .card[data-el="水"]{--el:var(--water)} .card[data-el="木"]{--el:var(--wood)} .card[data-el="無"]{--el:var(--none)}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;border-radius:6px;padding:3px 7px;border:1px solid var(--line);color:var(--muted)}
.chip.el{background:var(--el);color:#fff;border-color:transparent}
.chip.type{font-family:var(--f-display);font-weight:400;font-size:13px;color:var(--ink);border-color:var(--ink);padding:1px 6px}
.chip.use{margin-left:auto;font-family:var(--f-num)}
.cname .full{display:block;font-family:inherit;font-size:12px;color:var(--muted);margin-top:2px}
.nick{display:inline-block;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--line);font-size:11px}
.editor.inl{margin:2px 0 8px;padding:10px;gap:8px}
.btns3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.btns3 button{font-size:12px;padding:8px 4px}
.fl{display:grid;grid-template-columns:5.2em 1fr;align-items:center;gap:8px}
.fls{display:flex;gap:6px}.fls button{flex:1;font-size:13px;padding:8px 2px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:inherit}
.fls button[data-el="火"]{color:var(--fire)}.fls button[data-el="水"]{color:var(--water)}.fls button[data-el="木"]{color:var(--wood)}.fls button[data-el="無"]{color:var(--none)}
.fls button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.nkbulk{display:flex;flex-direction:column;gap:6px}
.dconf{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:10px;border:2px solid var(--ng);font-size:14px;font-weight:700}
.dhead{display:flex;justify-content:space-between;align-items:center}
.drow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.drow small{display:block;font-size:11px;color:var(--muted)}
.drow button,.dhead button{font-size:12px;padding:6px 12px;flex:none}
.fcard{display:block;width:100%;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:inherit;cursor:pointer;text-align:center}
.fcard .art{height:min(50vh,118vw);max-height:none;width:100%;object-fit:contain}
.fname{margin-top:10px;height:9em;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:2px}
.fname b{font-family:var(--f-display);font-size:clamp(22px,7vw,30px);line-height:1.25}
.fname small{font-size:12px;color:var(--muted)}
.fname.hidden{visibility:hidden}
.fedit{align-self:center;margin-top:4px;font-size:12px;color:var(--accent);text-decoration:underline;cursor:pointer}
.fcard .nickrow{margin:0 auto;width:100%;max-width:340px}
.btns.dim{opacity:.45}
.fbtns{display:grid;grid-template-columns:.8fr 1fr 1.4fr;gap:8px}
.fbtns button{padding-left:4px;padding-right:4px}
.askl{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.tg{border:2px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:999px;padding:8px 18px;font-size:16px;font-weight:700;min-width:7.5em}
.tg.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tg.big{border-radius:12px;font-size:15px}
.askb{display:flex;gap:8px;align-items:center}.askb .skip{white-space:nowrap;padding:8px 12px;font-size:14px}
.skip{border:2px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:700}
.sl.vol{grid-template-columns:3.6em 1fr 2.4em;font-size:13px}.sl.vol span{text-align:right;font-family:var(--f-num)}
.snd summary{display:flex;gap:8px;align-items:center;cursor:pointer;list-style:none;padding:13px 14px;border:2px solid var(--accent);border-radius:14px;background:var(--surface);font-size:15px}
.snd summary b{font-weight:700}.snd .sic{font-size:18px}
.snd summary::-webkit-details-marker{display:none}
.snd summary .sum{font-size:13px;color:var(--muted)}.snd summary .sum::after{content:" ▼";color:var(--accent);font-size:14px}.snd[open] summary .sum::after{content:" ▲"}
.snd .sum{margin-left:auto}.sndin{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.mode{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:color-mix(in srgb,var(--accent) 7%,var(--surface));border:2px solid var(--accent);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 22%,transparent)}
.mode h3{margin:0 0 2px;font-size:17px;display:flex;flex-direction:column;gap:2px}.mode h3 small{font-size:12px;font-weight:400;color:var(--muted)}
.mode.learn{border-color:var(--water);background:color-mix(in srgb,var(--water) 10%,var(--surface));box-shadow:0 4px 14px color-mix(in srgb,var(--water) 25%,transparent)}
.mode.quiz h3{color:var(--accent)}.mode.learn h3{color:var(--water)}.mode h3 small{color:var(--muted)}
.mode.rep{border-color:var(--wood);background:color-mix(in srgb,var(--wood) 9%,var(--surface));box-shadow:0 4px 14px color-mix(in srgb,var(--wood) 22%,transparent)}.mode.rep h3{color:var(--wood)}
.mode.rep .repbtn{background:var(--wood);box-shadow:0 3px 0 color-mix(in srgb,var(--wood) 60%,#000);color:#fff}
.mode.grd{border-color:#d08a12;background:color-mix(in srgb,#d08a12 9%,var(--surface));box-shadow:0 4px 14px color-mix(in srgb,#d08a12 22%,transparent)}.mode.grd h3{color:#d08a12}
.mode.grd .grdbtn{background:#d08a12;box-shadow:0 3px 0 color-mix(in srgb,#d08a12 60%,#000);color:#fff}
.tq{display:flex;flex-direction:column;gap:3px;font-size:14px;line-height:1.45;color:var(--ink)}
.tq .when{font-family:var(--f-num);font-size:28px;font-weight:700;color:var(--ink)}.tq .sm{font-size:12px;color:var(--muted)}
.mic{border:2px solid var(--wood);background:var(--surface);color:var(--wood);border-radius:12px;padding:12px 16px;font-size:16px;font-weight:700;min-width:9.5em;touch-action:manipulation}.mic.on{background:var(--wood);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.mode.learn .learnbtn{background:var(--water);box-shadow:0 3px 0 color-mix(in srgb,var(--water) 60%,#000);color:#fff}
.mode .best{margin:0}
.pad .go.wide{grid-column:1/-1}
.pad.prec{gap:6px}.pad.prec button{padding:7px 0;font-size:21px}.pad.prec .go{font-size:17px}
.hchip{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink);margin-right:4px}
.hbox summary{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:8px;list-style:none;cursor:pointer;padding:11px 12px;border:2px solid var(--accent);border-radius:12px;background:var(--surface)}
.hbox summary::-webkit-details-marker{display:none}.hbox .hv{color:var(--accent);font-size:13px}.hbox[open] .hv{transform:rotate(180deg)}
.hn{font-weight:700;font-size:15px}.hd{font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hp{font-family:var(--f-num);font-size:17px;font-weight:800;color:var(--accent)}
.hlist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.hopt{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:inherit}
.hopt.on{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.calc{display:block;font-size:12px;color:var(--muted);font-weight:400}
.author{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.author h3{margin:0;font-size:14px;color:var(--muted)}
.arow{display:grid;grid-template-columns:6.5em 1fr;align-items:center;gap:8px;font-size:15px}
.arow .al{font-size:12px;color:var(--muted)}.arow a{color:var(--accent);font-weight:700}
.code{justify-self:start;font-family:var(--f-num);font-size:16px;font-weight:700;letter-spacing:.04em;padding:4px 10px;border-radius:8px;border:1.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);color:inherit;user-select:all}
.code small{font-family:var(--f-body);font-size:10px;margin-left:4px;font-weight:400;letter-spacing:0;color:var(--muted)}
.nav{font-weight:700;border:2px solid var(--accent)!important;color:var(--accent)!important;padding:7px 12px!important}
.note.info{padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--accent) 8%,transparent);border-left:3px solid var(--accent)}
.legal{border-top:1px solid var(--line)}
.legal details{border-bottom:1px solid var(--line)}
.legal summary{display:flex;justify-content:space-between;align-items:center;list-style:none;cursor:pointer;padding:14px 4px;font-weight:700;font-size:15px}
.legal summary::-webkit-details-marker{display:none}.legal summary::after{content:"›";font-size:20px;color:var(--muted);transition:transform .2s}
.legal details[open] summary::after{transform:rotate(90deg)}
.lg{padding:0 4px 12px;font-size:13px;line-height:1.7;color:var(--muted)}.lg p{margin:0 0 8px}.lg b{color:var(--ink)}.lg a{color:var(--accent)}
.a2hs{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;padding:10px 12px;border-radius:12px;border:2px solid var(--water);background:color-mix(in srgb,var(--water) 10%,var(--surface));font-size:13px;line-height:1.6}
.a2hs p{margin:4px 0 0;color:var(--muted)}.a2x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px}
.is-claude .env-web,.is-web .env-claude{display:none}
.upd{font-size:12px;color:var(--muted);line-height:1.6;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.upd b{color:var(--ink)}.upd ul{margin:2px 0 0;padding-left:1.2em}
.upd summary{display:flex;justify-content:space-between;align-items:center;gap:8px;list-style:none;cursor:pointer;font-size:13px}.upd summary::-webkit-details-marker{display:none}
.upd .ul{color:var(--accent);font-weight:700;font-size:12px}.upd .ul::after{content:" ▼"}.upd[open] .ul::after{content:" ▲"}
.newupd{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;text-align:left;padding:11px 14px;border-radius:12px;border:2px solid var(--water);background:color-mix(in srgb,var(--water) 10%,var(--surface));font-size:14px;font-weight:700}.newupd .go{color:var(--water);font-size:13px}
.nb{display:inline-block;font-family:var(--f-num);font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:6px;background:var(--water);color:#fff;vertical-align:1px}
.cheerm{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:color-mix(in srgb,#000 55%,transparent);animation:cin .25s ease .5s both}
@keyframes cin{from{opacity:0}to{opacity:1}}
.cheerc{width:min(100%,380px);display:flex;flex-direction:column;gap:14px;padding:20px 18px;border-radius:18px;border:2px solid var(--accent);background:var(--surface);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.cheerc .ct{display:flex;flex-direction:column;gap:6px;font-size:16px;line-height:1.5}.cheerc .ct i{font-style:normal;display:inline-block}.cheerc .ct b i{display:block}.cheerc .cpath{font-size:12px!important}.cheerc .ct span{font-size:12.5px;color:var(--muted)}.cheerc .thx{padding:18px 0}
.cheerc .code.big{align-self:stretch;font-size:24px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);border:0;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}.cheerc .code.big small{color:inherit;opacity:.85;font-size:12px}
.cheerc .cb{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cheerc .cb .sub{padding:9px;font-size:13px;color:var(--muted)}
.cnote{margin:2px 0 0;font-size:11.5px}
.upd .udl{max-height:min(46vh,360px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-right:4px;margin-top:6px;border-bottom:1px solid var(--line)}
.upd .ud{margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.nxrow{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}.nxrow.one{grid-template-columns:1fr}
.fdone{display:flex;flex-direction:column;gap:12px;text-align:center}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cats button{font-size:13px;padding:9px 2px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:inherit;line-height:1.2}
.cats button small{display:block;font-size:10px;color:var(--muted)}
.cats button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}.cats button.on small{color:inherit;opacity:.7}
.cats button:first-child{grid-column:1/-1}
.nickrow{display:flex;gap:8px}.nickrow input{flex:1;min-width:0;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:inherit}
.cname{font-family:var(--f-display);font-size:clamp(19px,5.6vw,24px);line-height:1.3;text-wrap:balance;word-break:break-word}
.ability{font-size:13px;color:var(--muted);line-height:1.6;min-height:1.6em}
.ability button{border:1px dashed var(--line);background:none;border-radius:8px;padding:3px 9px;font-size:12px;color:var(--muted)}
.hud{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.hud .num{font-size:15px;color:var(--ink)}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}

/* answer */
.ask{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ask h2{font-size:16px}
.readout{font-family:var(--f-num);font-size:44px;font-weight:700;line-height:1;min-width:3.2ch;text-align:right;border-bottom:3px solid var(--ink);padding:0 4px 2px}
.readout span{font-size:16px;color:var(--muted);margin-left:3px;font-weight:500}
.readout.empty{color:var(--line)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto}
.pad button,.acts button{border:0;background:var(--key);border-radius:12px;box-shadow:0 3px 0 var(--key-shadow);font-family:var(--f-num);font-weight:700;font-size:24px;padding:12px 0;touch-action:manipulation}
.pad button:active,.acts button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--key-shadow)}
.pad .go{background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:18px;font-weight:400;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.pad .del{font-size:18px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto}
.acts button{font-family:var(--f-display);font-weight:400;font-size:30px;padding:22px 0}
.acts button small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);margin-top:4px;font-weight:500}

/* feedback */
.fb{border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-weight:700}
.fb.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok)}
.fb.ng{background:color-mix(in srgb,var(--ng) 14%,var(--surface));color:var(--ng)}
.fb .big{font-family:var(--f-display);font-weight:400;font-size:26px}
.fb .ans{color:var(--ink);font-weight:500;font-size:14px;line-height:1.5}
.fb .ans b{font-family:var(--f-num);font-size:18px}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* result & list */
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-family:var(--f-num);font-size:64px;line-height:1}
.score span{color:var(--muted);font-size:15px}
.stats{display:flex;gap:10px}
.stats div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--muted)}
.stats b{display:block;font-family:var(--f-num);font-size:20px;color:var(--ink)}
.rows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:6px 1fr auto;gap:10px;align-items:center;padding:10px 12px 10px 0;border-top:1px solid var(--line);font-size:13.5px}
.row:first-child{border-top:0}
.row i{align-self:stretch;background:var(--el)}
.row[data-el="火"]{--el:var(--fire)} .row[data-el="水"]{--el:var(--water)} .row[data-el="木"]{--el:var(--wood)} .row[data-el="無"]{--el:var(--none)}
.row .n{min-width:0;line-height:1.4}
.row .n small{display:block;color:var(--muted);font-size:11px}
.row .v{font-family:var(--f-num);font-weight:700;font-size:16px;text-align:right;min-width:3ch}
.row .a{font-family:var(--f-display);font-size:15px;width:1.6em;text-align:center}
.row .bad{color:var(--ng)}
.art{width:100%;max-height:34vh;object-fit:contain;border-radius:8px;display:block}
.card .art{height:34vh;max-height:none}
.card.has-art{display:grid;grid-template-columns:47% 1fr;grid-template-rows:auto 1fr auto;gap:6px 12px;align-items:start;padding:12px 12px 12px 18px}
.card.has-art .art{grid-column:1;grid-row:1/4;height:auto;aspect-ratio:480/661;max-height:38vh;object-fit:contain}
.card.has-art .meta{grid-column:2;grid-row:1}
.card.has-art .meta .use{display:none}
.card.has-art .cname{grid-column:2;grid-row:2;font-size:clamp(16px,4.6vw,20px);align-self:center}
.card.has-art .ability{grid-column:2;grid-row:3}
@media (max-height:760px){.pad button{padding:9px 0;font-size:22px}.readout{font-size:38px}.screen{gap:10px}}
.row .th{width:38px;height:52px;border-radius:5px;object-fit:cover;border:1px dashed var(--line);display:grid;place-items:center;font-size:16px;color:var(--muted);background:none;padding:0}
.row.tap{cursor:pointer;grid-template-columns:6px auto 1fr auto auto}
.row .ck{width:22px;height:22px;margin:0;accent-color:var(--accent,#3b82f6)}
.row.off .n,.row.off .v,.row.off .th{opacity:.4}
.exbar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.exbar button{font-size:12px;padding:6px 10px}
.editor{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.editor canvas{width:100%;max-height:46vh;object-fit:contain;border-radius:8px;background:var(--bg)}
.sl{display:grid;grid-template-columns:2.4em 1fr;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.sl input{width:100%}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.danger{color:var(--ng)}
.filter{display:flex;gap:8px}
.filter input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

    ${game.step==="ct"?`<div class="pad${game.precise?" prec":""}" id="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button type="button" data-d="${d}">${d}</button>`).join("")}<button type="button" class="del" data-k="del" aria-label="1文字消す">⌫</button><button type="button" data-d="0">0</button>${game.precise?`<button type="button" data-d=".">.</button><button type="button" class="go wide" data-k="go">決定</button>`:`<button type="button" class="go" data-k="go">決定</button>`}</div>`
    :`<div class="acts" id="acts">${["無","短","長"].map(a=>`<button type="button" data-a="${a}">${a}<small>${ACT_NOTE[a]}</small></button>`).join("")}</div>`}`;
  $("#hint").onclick=()=>{$("#ab").textContent=c.ab};
  $("#skipBtn").onclick=skip;
  if(game.step==="ct"){
    $("#pad").onclick=e=>{const b=e.target.closest("button");if(!b)return;
      if(b.dataset.d!=null) typeDigit(b.dataset.d); else if(b.dataset.k==="del") del(); else submitCt();};
  }else{
    $("#acts").onclick=e=>{const b=e.target.closest("button");if(b) submitAct(b.dataset.a)};
  }

function updRO(){const ro=$("#ro");if(!ro)return;ro.className="readout"+(game.input?"":" empty");ro.innerHTML=(game.input||"00")+"<span>秒</span>"}
function typeDigit(d){const s=game.input;if(d==="."){if(!game.precise||s.includes("."))return;game.input=(s||"0")+".";updRO();return}if(s.includes(".")){if(/\.\d$/.test(s))return}else if(s.length>=3)return;game.input=(s+d).replace(/^0+(?=\d)/,"");updRO()}
function del(){game.input=game.input.slice(0,-1);updRO()}

function startTimer(){stopTimer();timerId=setInterval(()=>{const el=$("#clock");if(el)el.textContent=fmt(performance.now()-game.t0)},50)}
function stopTimer(){if(timerId)clearInterval(timerId);timerId=null}

view.addEventListener("click",e=>{if(e.target.id==="laterTg"&&game&&!document.getElementById("next"))setLater(!game.cur.later)});
function setLater(v){game.cur.later=v;const t=$("#laterTg");if(t){t.classList.toggle("on",v);t.setAttribute("aria-pressed",v);t.textContent=(v?"☑":"☐")+" あとで"}}
function submitCt(){
  if(!game.input)return;
  const c=game.cur.card, v=+game.input, ok=isOk(c,v);
  game.cur.ansCt=v; if(!ok) game.cur.ok=false;
  if(settings.mode==="both"&&ok){game.step="act";game.input="";render(`<div class="fb ok"><span class="big">○</span><span class="ans">CT <b>${eff(c)}</b> 秒　続けて発動時間</span></div>`);return}
  if(settings.mode==="both"&&!ok){game.step="act";game.input="";render(`<div class="fb ng shake"><span class="big">×</span><span class="ans">CT は <b>${eff(c)}</b> 秒（入力 ${v}）　続けて発動時間</span></div>`);return}
  finish();
}
const byName=n=>CARDS.find(c=>c.name===n);
function saveQuiz(i){if(!game)return;store.set("resume",{k:"quiz",q:game.qs.map(c=>c.name),i,log:game.log.map(x=>({n:x.card.name,ok:x.ok,ms:x.ms,ansCt:x.ansCt,ansAct:x.ansAct,later:!!x.later})),w:!!game.isWeak,h:game.hero?game.hero.id:"",p:!!game.precise,key:game.key,skip:game.skip||0})}
function saveFlash(){const f=flash;if(!f)return;store.set("resume",{k:"flash",q:f.deck.map(c=>c.name),i:f.i,known:f.known,again:f.again,total:f.total,mada:f.mada})}
function resumeInfo(){const r=store.get("resume",null);if(!r||!r.q)return null;const qs=r.q.map(byName);if(qs.some(c=>!c)||r.i>=qs.length)return null;return Object.assign({},r,{qs})}
function resume(){const r=resumeInfo();if(!r){home();return}SND.startBgm();showMute(true);
  if(r.k==="flash"){flash={hist:[],deck:r.qs,i:r.i,known:r.known,again:r.again,total:r.total,open:false,edit:false,mada:r.mada};$("#navBtn").textContent="やめる";$("#navBtn").onclick=home;drawFlash();return}
  const hero=HEROES.find(h=>h.id===r.h)||null;
  game={qs:r.qs,i:r.i,log:r.log.map(x=>Object.assign({},x,{card:byName(x.n)})).filter(x=>x.card),isWeak:r.w,hero,precise:!!(hero&&r.p),key:r.key,skip:r.skip||0};
  $("#navBtn").textContent="やめる";$("#navBtn").onclick=home;ask()}
function skip(){stopTimer();game.skip=(game.skip||0)+1;if(game.i>=game.qs.length-1){result();return}game.i++;ask()}
function submitAct(a){game.cur.ansAct=a;if(a!==game.cur.card.act)game.cur.ok=false;finish()}

function finish(){
  stopTimer();
  const c=game.cur.card; game.cur.ms=performance.now()-game.t0;
  game.log.push(game.cur);
  const miss=getMiss();
  if(game.cur.ok){if(miss[c.name])miss[c.name]=Math.max(0,miss[c.name]-1)}else miss[c.name]=(miss[c.name]||0)+1;
  if(game.cur.later)miss[c.name]=Math.max(1,miss[c.name]||0);
  if(!miss[c.name])delete miss[c.name];
  store.set("miss",miss);
  const parts=[]; if(settings.mode!=="act")parts.push(`CT <b>${eff(c)}</b> 秒${game.hero?`<small class="calc">（元${c.ct}秒×${game.hero.m}${!game.precise&&exact(c)%1?`／${Math.floor(exact(c))}でも${Math.ceil(exact(c))}でも正解`:""}）</small>`:""}`); if(settings.mode!=="ct")parts.push(`発動 <b>${c.act}</b>`);
  if(game.cur.ok)SND.ok();else SND.ng();
  const fb=game.cur.ok
    ?`<div class="fb ok"><span class="big">○</span><span class="ans">${parts.join("　")}<br>${fmt(game.cur.ms)} 秒</span></div>`
    :`<div class="fb ng shake"><span class="big">×</span><span class="ans">正解：${parts.join("　")}</span></div>`;
  const nm=$("#cname"); if(nm) nm.innerHTML=NICK[c.name]?`${esc(NICK[c.name])}<small class="full">${esc(c.name)}</small>`:esc(c.name);
  const last=game.i===game.qs.length-1;
  if(last)store.set("resume",null);else saveQuiz(game.i+1);
  view.querySelector(".ask")?.remove(); (view.querySelector("#pad")||view.querySelector("#acts"))?.remove();
  view.querySelector(".fb")?.remove();
  view.querySelector(".card").insertAdjacentHTML("afterend",fb+`<div class="nxrow one"${game.cur.ok&&!game.cur.later?" style=\"display:none\"":""}><button class="primary" id="next" type="button">${last?"結果を見る":"次へ"}</button></div>`);
  let done=false;const go=()=>{if(done)return;done=true;clearTimeout(game.auto);if(last)result();else{game.i++;ask()}};
  $("#next").onclick=go; $("#next").focus();
  if($("#laterTg"))$("#laterTg").onclick=()=>{clearTimeout(game.auto);const v=!game.cur.later;setLater(v);const m=getMiss();
    if(v)m[c.name]=Math.max(1,m[c.name]||0);else delete m[c.name];store.set("miss",m)};
  if(game.cur.ok&&!game.cur.later){game.auto=setTimeout(()=>{if(document.getElementById("next"))go()},700)}
}

function result(){
  showMute(false);
  clearTimeout(game.auto);store.set("resume",null);
  if(!game.log.length){home();return}
  const L=game.log, ok=L.filter(x=>x.ok), pct=Math.round(ok.length/L.length*100);
  const avg=ok.length?ok.reduce((s,x)=>s+x.ms,0)/ok.length:0;
  if(!game.isWeak&&ok.length){const best=store.get("best",{});const b=best[game.key];
    if(!b||pct>b.score||(pct===b.score&&avg<b.avg)){best[game.key]={score:pct,avg};store.set("best",best)}}
  const wrong=L.filter(x=>!x.ok), slow=ok.slice().sort((a,b)=>b.ms-a.ms).slice(0,3);
  $("#navBtn").textContent="📋 カード一覧"; $("#navBtn").onclick=list;
  view.innerHTML=`
    <div class="score"><b class="num">${pct}</b><span>% 正解（${ok.length} / ${L.length}）</span></div>${game.skip?`<p class="note">スキップ ${game.skip}枚（成績・復習には入りません）</p>`:""}
    <div class="stats"><div>正解の平均<b>${ok.length?fmt(avg):"—"}</b>秒</div><div>最速<b>${ok.length?fmt(Math.min(...ok.map(x=>x.ms))):"—"}</b>秒</div></div>${cheerCard()}
    ${wrong.length?`<span class="label">間違えたカード</span><div class="rows">${wrong.map(x=>rowHtml(x.card,true,x)).join("")}</div>`:`<p class="note">全問正解です。</p>`}
    ${slow.length?`<span class="label">時間がかかったカード</span><div class="rows">${slow.map(x=>rowHtml(x.card,false,null,fmt(x.ms)+"秒")).join("")}</div>`:""}
    ${wrong.length?`<button class="primary" id="retry" type="button">間違えた ${wrong.length} 枚をもう一度</button>`:""}
    <button class="sub" id="again" type="button">同じ設定でもう一度</button>
    <button class="sub" id="back" type="button">ホームへ</button>`;
  if(wrong.length)$("#retry").onclick=()=>start(wrong.map(x=>x.card),true);
  $("#again").onclick=()=>start(poolFor(),false);
  $("#back").onclick=home;
}

const DB={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open("cdrill",1);r.onupgradeneeded=()=>r.result.createObjectStore("img");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async tx(fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction("img","readwrite");fn(t.objectStore("img"));t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})},
  put(k,v){return this.tx(st=>st.put(v,k))},
  del(k){return this.tx(st=>st.delete(k))},
  async all(){const db=await this.open();return new Promise((res,rej)=>{const m={};const r=db.transaction("img").objectStore("img").openCursor();r.onsuccess=()=>{const c=r.result;if(c){m[c.key]=c.value;c.continue()}else res(m)};r.onerror=()=>rej(r.error)})}
};

async function extractAudio(file){
  const A=window.AudioContext||window.webkitAudioContext,ac=SND.ensure()||new A();
  const buf=await file.arrayBuffer();
  const dec=await new Promise((res,rej)=>{const p=ac.decodeAudioData(buf,res,rej);if(p&&p.then)p.then(res,rej)});
  const sr=22050,dur=Math.min(dec.duration,600),len=Math.ceil(dur*sr);
  const O=window.OfflineAudioContext||window.webkitOfflineAudioContext,oc=new O(1,len,sr);
  const src=oc.createBufferSource();src.buffer=dec;src.connect(oc.destination);src.start();
  const out=await new Promise((res,rej)=>{oc.oncomplete=e=>res(e.renderedBuffer);const p=oc.startRendering();if(p&&p.then)p.then(res,rej)});
  const d=out.getChannelData(0),b=new ArrayBuffer(44+d.length*2),v=new DataView(b);
  const w=(o,str)=>{for(let k=0;k<str.length;k++)v.setUint8(o+k,str.charCodeAt(k))};
  w(0,"RIFF");v.setUint32(4,36+d.length*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,d.length*2,true);
  for(let k=0;k<d.length;k++){const x=Math.max(-1,Math.min(1,d[k]));v.setInt16(44+k*2,x<0?x*32768:x*32767,true)}
  const nm=(file.name||"音源").replace(/\.[^.]+$/,"");
  return new File([b],nm+".wav",{type:"audio/wav"});
}
function alertNote(t){const n=document.createElement("p");n.className="note danger";n.textContent=t;view.prepend(n)}
$("#file").onchange=async e=>{
  const file=e.target.files[0]; if(!file||!editing)return;
  const img=new Image(); img.src=URL.createObjectURL(file);
  try{await img.decode()}catch(err){$("#ed").innerHTML=`<p class="note danger">画像を読み込めませんでした。PNGかJPEGのスクショを選んでください。</p>`;return}
  editing.img=img; editing.rect=detectArt(img); editing.adj={t:0,b:0,l:0,r:0};
  showEditor();
};
// カード詳細画面のスクショから、外側の属性色（赤・青・緑）の枠を手がかりにカード絵の範囲を推定する
function detectArt(img){
  const W=img.naturalWidth,H=img.naturalHeight,sc=Math.min(1,400/W);
  const cv=document.createElement("canvas");cv.width=Math.round(W*sc);cv.height=Math.round(H*sc);
  const cx=cv.getContext("2d",{willReadFrequently:true});cx.drawImage(img,0,0,cv.width,cv.height);
  const d=cx.getImageData(0,0,cv.width,cv.height).data;
  let x0=1e9,y0=1e9,x1=-1,y1=-1;
  for(let y=0;y<cv.height;y++)for(let x=0;x<cv.width;x++){const i=(y*cv.width+x)*4;
    const r=d[i],g=d[i+1],b=d[i+2];
    if((r>190&&g<60&&b<60)||(g>150&&r<90&&b<70)||(b>170&&r<60&&g<90)){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(x1>0&&(x1-x0)>cv.width*.5&&(y1-y0)>cv.height*.45){
    const bx=x0/sc,by=y0/sc,bw=(x1-x0)/sc,bh=(y1-y0)/sc;
    return{x:bx+bw*.0208,y:by+bh*.0807,w:bw*.9584,h:bh*.8809};
  }
  return{x:W*.149,y:H*.179,w:W*.702,h:H*.671};
}
function cropRect(){const r=editing.rect,a=editing.adj,W=editing.img.naturalWidth,H=editing.img.naturalHeight,u=W*.004;
  const x=Math.max(0,r.x-a.l*u),y=Math.max(0,r.y-a.t*u);
  return{x,y,w:Math.max(10,Math.min(W-x,r.w+(a.l+a.r)*u)),h:Math.max(10,Math.min(H-y,r.h+(a.t+a.b)*u))}}
function drawCrop(cv,maxW){const c=cropRect(),k=Math.min(1,maxW/c.w);cv.width=Math.round(c.w*k);cv.height=Math.round(c.h*k);
  cv.getContext("2d").drawImage(editing.img,c.x,c.y,c.w,c.h,0,0,cv.width,cv.height)}
function closeEditor(){$("#ed").innerHTML="";editing=null}
function showEditor(){
  const c=editing.card;
  $("#ed").innerHTML=`<div class="editor"><h2>${esc(c.name)}</h2><canvas id="cv"></canvas>
    ${[["t","上"],["b","下"],["l","左"],["r","右"]].map(([k,t])=>`<label class="sl">${t}<input type="range" id="adj-${k}" min="-30" max="30" value="0"></label>`).join("")}
    <p class="note">ずれていたらスライダーで調整します。右に動かすとその方向に広がります。</p>
    <div class="btns"><button class="primary" id="saveImg" type="button">保存</button><button class="sub" id="cancelImg" type="button">やめる</button></div>
    ${IMG[c.name]?`<button class="sub danger" id="delImg" type="button">登録済みの画像を削除</button>`:""}</div>`;
  const cv=$("#cv");drawCrop(cv,800);
  $("#ed").querySelectorAll("input[type=range]").forEach(r=>r.oninput=()=>{editing.adj[r.id.slice(4)]=+r.value;drawCrop(cv,800)});
  $("#cancelImg").onclick=closeEditor;
  $("#saveImg").onclick=()=>{const out=document.createElement("canvas");drawCrop(out,480);
    out.toBlob(async b=>{try{await DB.put(c.name,b)}catch(err){$("#ed").insertAdjacentHTML("beforeend",`<p class="note danger">保存できませんでした。プライベートブラウズでは保存できないことがあります。</p>`);return}
      if(IMG[c.name])URL.revokeObjectURL(IMG[c.name]);IMG[c.name]=URL.createObjectURL(b);closeEditor();listDraw&&listDraw()},"image/jpeg",.85)};
  const del=$("#delImg");if(del)del.onclick=async()=>{try{await DB.del(c.name)}catch(err){}if(PRESET[c.name])IMG[c.name]=PRESET[c.name];else delete IMG[c.name];closeEditor();listDraw&&listDraw()};
  $("#ed").scrollIntoView({behavior:"smooth",block:"nearest"});
}

// ---- 端末間の同期（claude.aiアカウントに保存） ----
let syncRef=null,syncTimer=null,syncState="local";
function syncBody(){return{nick:Object.entries(NICK),excl:[...EXCL],del:[...DEL],mada:[...MADA],t:Date.now()}}
function queueSync(){if(!syncRef)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>{syncTimer=null;syncRef.set(syncBody()).catch(()=>{})},600)}
function applyRemote(d){
  NICK=Object.fromEntries(Array.isArray(d.nick)?d.nick:[]);EXCL=new Set(d.excl||[]);DEL=new Set(d.del||[]);if(d.mada)MADA=new Set(d.mada);
  try{localStorage.setItem("cdrill:nick",JSON.stringify(NICK));localStorage.setItem("cdrill:excl",JSON.stringify([...EXCL]));localStorage.setItem("cdrill:del",JSON.stringify([...DEL]));localStorage.setItem("cdrill:mada",JSON.stringify([...MADA]))}catch(e){}
  if(game||flash)return; if(listDraw&&!$("#nk"))list(); else if(!listDraw)home();
}
(async()=>{try{
  if(!window.claude||!claude.use)return;
  const db=await claude.use("db"),user=await claude.use("user"); if(!db||!user)return;
  const id=await user.id(); if(!id)return;
  const ref=db.collection("data/users/"+id).doc("prefs");
  const snap=await ref.get(); const first=!store.get("synced",false);
  if(snap.exists){const d=snap.data();
    if(first){const n=Object.fromEntries(Array.isArray(d.nick)?d.nick:[]);
      applyRemote({nick:Object.entries({...NICK,...n}),excl:[...new Set([...(d.excl||[]),...EXCL])],del:[...new Set([...(d.del||[]),...DEL])],mada:[...new Set([...(d.mada||[]),...MADA])]});
      syncRef=ref;await ref.set(syncBody());}
    else{applyRemote(d);syncRef=ref;}
  }else{syncRef=ref;if(Object.keys(NICK).length||EXCL.size||DEL.size)await ref.set(syncBody());}
  try{localStorage.setItem("cdrill:synced","true")}catch(e){}
  syncState="sync";
  let skip=true;ref.onSnapshot(sn=>{if(skip){skip=false;return}if(sn.exists&&!syncTimer)applyRemote(sn.data())},()=>{});
}catch(e){}})();

home();
</script>
